name: Release

# Push a tag like v1.2.0 (tools/release.sh does it) to build, sign and publish that version.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6

      - name: Check the tag matches the version
        run: |
          version=$(sed -n 's/^nimbus.version=//p' gradle.properties)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match nimbus.version=$version in gradle.properties"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.NIMBUS_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Add the NIMBUS_KEYSTORE_BASE64, NIMBUS_KEYSTORE_PASSWORD, NIMBUS_KEY_ALIAS and NIMBUS_KEY_PASSWORD secrets"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "NIMBUS_KEYSTORE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Test and build
        env:
          NIMBUS_KEYSTORE_PASSWORD: ${{ secrets.NIMBUS_KEYSTORE_PASSWORD }}
          NIMBUS_KEY_ALIAS: ${{ secrets.NIMBUS_KEY_ALIAS }}
          NIMBUS_KEY_PASSWORD: ${{ secrets.NIMBUS_KEY_PASSWORD }}
        run: ./gradlew --no-daemon testReleaseUnitTest assembleRelease

      - name: Package
        run: |
          mkdir dist
          cp app/build/outputs/apk/release/app-release.apk "dist/Nimbus-$VERSION.apk"
          (cd dist && sha256sum "Nimbus-$VERSION.apk" > SHA256SUMS)
          # The release notes are this version's section of the changelog.
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          test -s notes.md || echo "Nimbus $VERSION" > notes.md

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "Nimbus $VERSION" --notes-file notes.md --verify-tag
